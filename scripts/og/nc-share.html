<!doctype html>
<!-- Delingsbilde (Open Graph) for nc.stovnerfrisbee.no: skjermbilde i 1200×630, lagret som static/nc-share.jpg -->
<html lang="nb">
<head>
<meta charset="utf-8" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=block" rel="stylesheet" />
<style>
	:root {
		--color-bg: #F4F8F5;
		--color-primary-dark: #134F30;
		--color-accent: #D4622A;
		--color-muted: #4D6B5A;
	}
	* { margin: 0; box-sizing: border-box; }
	html, body { width: 1200px; height: 630px; overflow: hidden; }
	body {
		background: var(--color-bg);
		font-family: 'Inter', system-ui, sans-serif;
		display: flex;
		gap: 48px;
		padding: 56px;
	}
	.text { flex: 1; display: flex; flex-direction: column; justify-content: center; min-width: 0; }
	.pennants { display: flex; gap: 10px; margin-bottom: 36px; }
	.pennants span { width: 0; height: 0; border-left: 10px solid transparent; border-right: 10px solid transparent; border-top: 20px solid var(--color-primary-dark); }
	.pennants span:nth-child(even) { border-top-color: var(--color-accent); }
	.date { font-size: 22px; text-transform: uppercase; letter-spacing: 0.2em; color: var(--color-muted); }
	h1 { margin-top: 18px; font-size: 104px; font-weight: 800; line-height: 1.02; letter-spacing: -0.045em; color: var(--color-primary-dark); }
	h1 span { color: var(--color-accent); }
	.photo { width: 430px; border-radius: 24px; overflow: hidden; }
	.photo img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 58%; }
</style>
</head>
<body>
	<div class="text">
		<div class="pennants"><span></span><span></span><span></span><span></span><span></span></div>
		<p class="date">6.–8. august 2027 · Stovner</p>
		<h1>Norges Cup <span>#4</span></h1>
	</div>
	<div class="photo"><img src="../../static/rocker.jpg" alt="" /></div>
</body>
</html>
